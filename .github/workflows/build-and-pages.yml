name: Build firmware and publish web flasher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP8266 firmware
        run: pio run -e roboglitch
      - name: Prepare flasher website
        run: |
          mkdir -p dist
          cp docs/index.html docs/manifest.json dist/
          cp .pio/build/roboglitch/firmware.bin dist/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: RoboGlitch-ESP8266-firmware
          path: dist/firmware.bin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        uses: actions/deploy-pages@v4
